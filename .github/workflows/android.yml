name: Unzip and Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3

    - name: Locate and Build Project
      run: |
        unzip -o project.zip -d extracted
        
        # settings.gradle অথবা build.gradle যেখানে আছে সেই আসল ফোল্ডার খুঁজে বের করবে
        if [ -f "$(find extracted -name "settings.gradle" | head -n 1)" ]; then
          TARGET_DIR=$(dirname "$(find extracted -name "settings.gradle" | head -n 1)")
        elif [ -f "$(find extracted -name "build.gradle" | head -n 1)" ]; then
          TARGET_DIR=$(dirname "$(find extracted -name "build.gradle" | head -n 1)")
        else
          echo "No gradle file found!"
          exit 1
        fi
        
        echo "Going into project directory: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        # gradlew না থাকলে বানিয়ে নিবে
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew
        
        ./gradlew assembleDebug --stacktrace

    - name: Upload Built APK
      uses: actions/upload-artifact@v4
      with:
        name: My-App-APK
        path: '**/build/outputs/apk/debug/*.apk'
