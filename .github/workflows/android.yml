name: Unzip and Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3

    - name: Extract and Build Project
      run: |
        mkdir -p extracted
        unzip -o project.zip -d extracted
        cd extracted
        
        # যদি ভেতর কোনো ফোল্ডার থাকে, তবে সেখানে ঢুকবে
        if [ ! -f "build.gradle" ] && [ ! -f "settings.gradle" ]; then
          cd $(find . -maxdepth 2 -name "app" -type d | head -n 1)/.. || true
        fi

        # gradlew না থাকলে বানিয়ে নিবে
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi

        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload Built APK
      uses: actions/upload-artifact@v4
      with:
        name: My-App-APK
        path: '**/build/outputs/apk/debug/*.apk'
