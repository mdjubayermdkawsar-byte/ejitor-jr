name: Unzip and Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Setup and Build Android
      run: |
        unzip -o project.zip -d extracted
        cd extracted

        # Settings এবং Root build তৈরি
        if [ -d "app" ] && [ ! -f "settings.gradle" ]; then
          cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "ejitor"
        include ':app'
        EOF

          cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.0' apply false
        }
        EOF
        fi

        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

        # ক্লিন আউটপুট (যাতে শুধু মূল কারণ দেখা যায়)
        ./gradlew :app:assembleDebug --no-daemon

    - name: Upload Built APK
      uses: actions/upload-artifact@v4
      with:
        name: My-App-APK
        path: '**/build/outputs/apk/debug/*.apk'
